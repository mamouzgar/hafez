name: Test on macOS

on: [push, pull_request]

jobs:
  test-macos:
    runs-on: macos-13  # Apple Silicon or Intel — GitHub manages which
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"

      - name: Install system dependencies
        run: |
          brew install gcc pkg-config icu4c udunits abseil cmake cmake-docs
          echo 'PKG_CONFIG_PATH="/opt/homebrew/opt/icu4c/lib/pkgconfig"' >> $GITHUB_ENV

      - name: Install Python dependencies
        run: pip install hafezR

      # **Install R first**
      - name: Install R
        run: brew install --cask r

      # Then install R packages needed for testing
      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("devtools", "testthat"), repos="https://cran.r-project.org")'

      # Run your R tests
      - name: Run R tests
        run: |
          Rscript -e 'devtools::test()'
