name: Install check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  install-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        r: ["release"]

    runs-on: ${{ matrix.os }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      # -- Linux system deps --------------------------------------------------
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gfortran libcurl4-openssl-dev libssl-dev libxml2-dev \
            libglpk40 libglpk-dev

      # -- macOS system deps --------------------------------------------------
      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config
          # Install the official CRAN gfortran toolchain (puts gfortran at /opt/gfortran/
          # which is where R's Makeconf looks for it on macOS arm64/x86_64)
          curl -LO https://mac.r-project.org/tools/gfortran-14.2-universal.pkg
          sudo installer -pkg gfortran-14.2-universal.pkg -target /

      # -- R setup ------------------------------------------------------------
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true

      # -- Install hafez from local source (simulates install_github) ---------
      - name: Install remotes
        run: Rscript -e 'install.packages("remotes", repos="https://cloud.r-project.org")'

      - name: Install hafez and all dependencies
        run: |
          Rscript -e 'remotes::install_local(".", build_vignettes=FALSE, dependencies=TRUE)'

      # -- Smoke test ---------------------------------------------------------
      - name: Verify package loads
        run: |
          Rscript -e 'library(hafez); cat("hafez loaded on", R.version$os, "\n")'
